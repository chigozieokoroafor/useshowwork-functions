version: "3.8"

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: showwork-bullmq-worker
    restart: unless-stopped
    # Load environment variables from .env or .env.production
    env_file:
      - ${ENV_FILE:-.env}
    # Optional resource limits
    deploy:
      resources:
        limits:
          memory: 1G
    # If Redis is running on the host machine, use host network or host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local Redis service if not using an external/host Redis instance:
  # redis:
  #   image: redis:7-alpine
  #   container_name: showwork-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
